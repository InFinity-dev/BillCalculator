{% macro icon(name, class_name='') -%}
<svg class="icon {{ class_name }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    {% if name == 'home' %}<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>
    {% elif name == 'building' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h1m4 0h1M9 11h1m4 0h1M9 15h1m4 0h1M10 21v-3h4v3"/>
    {% elif name == 'calculator' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h1m3 0h1m3 0h1M8 15h1m3 0h1m3 0h1M8 18h1m3 0h1m3 0h1"/>
    {% elif name == 'chart' %}<path d="M4 3v17h17M8 15v-4m5 4V7m5 8V4"/>
    {% elif name == 'document' %}<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8Zm0 0v5h5M9 12h6m-6 4h6"/>
    {% elif name == 'wallet' %}<path d="M20 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-2M3 8h17v8h-6a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2ZM16 12h.01"/>
    {% elif name == 'settings' %}<path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 2 3-2v-3l3-2-1-3-3-1-1-3Z"/><circle cx="11.5" cy="11.5" r="3"/>
    {% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
    {% elif name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
    {% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
    {% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
    {% endif %}
</svg>
{%- endmacro %}
